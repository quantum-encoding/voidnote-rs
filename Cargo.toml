[package]
name        = "voidnote"
version     = "0.4.0"
edition     = "2021"
description = "Official Rust SDK for VoidNote — zero-knowledge self-destructing notes, no account needed"
license     = "MIT"
repository  = "https://github.com/quantum-encoding/voidnote-rs"
keywords    = ["voidnote", "encryption", "zero-knowledge", "self-destructing", "notes"]
categories  = ["cryptography", "web-programming::http-client"]
readme      = "README.md"

[lib]
name = "voidnote"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[dependencies]
# HTTP client — async with streaming response body support
reqwest  = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# AES-256-GCM (pure Rust, no OpenSSL)
aes-gcm  = "0.10"

# SHA-256 for key derivation (pure Rust)
sha2     = "0.10"

# PBKDF2-HMAC-SHA256 for password-protected notes (pure Rust)
pbkdf2   = { version = "0.12", default-features = false, features = ["hmac"] }

# Hex encoding/decoding
hex      = "0.4"

# JSON
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime (optional: users may bring their own)
tokio = { version = "1", features = ["full"] }

# Stream combinators
futures-core = "0.3"
futures      = "0.3"

# Ergonomic async generators for Stream impl
async-stream = "0.3"

# Byte utilities for SSE parsing
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"
mockito    = "1"


# 600k PBKDF2 iterations take about 6 s per key in an unoptimised build; optimise the
# key-derivation path (pbkdf2_hmac is generic, so it is compiled in this crate)
# for this crate's own tests and examples.
[profile.dev.package.voidnote]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
